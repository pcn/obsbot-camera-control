name: AppImage

# Not per-commit: the Qt download dominates runtime. But packaging breaks in
# ways a plain compile cannot catch (a new Qt module, a missing backend
# plugin), so it also runs on pull requests that touch what goes into the
# bundle. Branch runs upload the AppImage as an artifact, so a test build
# never needs to reach main.
on:
  workflow_dispatch:
    inputs:
      qt_version:
        description: Qt version to build against
        required: false
        default: "6.8.3"
  pull_request:
    paths:
      - .github/workflows/appimage.yml
      - CMakeLists.txt
      - src/**
      - sdk/**
      - resources/**
      - obsbot-control.desktop

env:
  # Qt 6.5+ defaults QtMultimedia to the FFmpeg backend, which is far more
  # bundle-friendly than the GStreamer backend. The base image's own Qt is
  # too old, so Qt comes from aqtinstall rather than apt.
  QT_ARCH: linux_gcc_64
  APPIMAGE_EXTRACT_AND_RUN: 1
  # Only workflow_dispatch supplies inputs; a pull_request run would otherwise
  # pass an empty version to aqtinstall. Keep this default in step with the
  # workflow_dispatch input default above.
  QT_VERSION: ${{ inputs.qt_version || '6.8.3' }}
  # The compatibility promise made to users, enforced by the verify step. Set
  # to the container's own glibc rather than the lower value the bundle
  # happens to require, so the promise cannot be broken by a dependency
  # bumping the real floor. Changing this means changing README.md too.
  GLIBC_FLOOR: "2.39"

jobs:
  appimage:
    name: AppImage (x86_64)
    runs-on: ubuntu-latest
    # Pinned in a container rather than using a runner label so the ABI target
    # is ours, not tied to GitHub's runner deprecation schedule. Because Qt is
    # installed by aqtinstall, this choice sets exactly one thing: the glibc
    # floor of the resulting AppImage. 24.04 = glibc 2.39.
    container: ubuntu:24.04

    steps:
      # libpulse-dev/libasound2-dev are needed at link time, not just runtime:
      # Qt's official libQt6Multimedia references pa_strerror@PULSE_0, so the
      # GUI fails to link without PulseAudio present.
      #
      # The Xrandr/xcb-glx/VA-API/VDPAU group is separate from the xcb group
      # above it. Those are for Qt's xcb platform plugin; these are for the
      # FFmpeg that Qt bundles inside libffmpegmediaplugin.so. linuxdeploy
      # resolves a plugin's dependencies transitively and hard-fails on the
      # first one it cannot find, so a missing libXrandr fails the whole
      # AppImage rather than merely dropping video acceleration.
      - name: Install build and packaging dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config git curl ca-certificates \
            file desktop-file-utils patchelf zsync zstd tar \
            python3 python3-venv \
            libgl1-mesa-dev libglx-dev libegl-dev \
            libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xkb1 \
            libfontconfig1 libfreetype6 libdbus-1-3 \
            libpulse-dev libasound2-dev \
            libxrandr2 libxext6 libxfixes3 libxi6 libxshmfence1 \
            libxcb-glx0 libxcb-dri2-0 libxcb-dri3-0 libxcb-present0 \
            libxcb-sync1 libxcb-xfixes0 \
            libva2 libva-drm2 libva-x11-2 libvdpau1

      - uses: actions/checkout@v4

      # Keyed on the Qt version and arch only: the install is a pure function of
      # those, independent of our source. This is what makes a per-PR AppImage
      # build affordable, since the download otherwise dominates the run.
      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: /opt/qt
          key: qt-${{ env.QT_VERSION }}-${{ env.QT_ARCH }}-multimedia

      - name: Install Qt ${{ env.QT_VERSION }}
        if: steps.qt-cache.outputs.cache-hit != 'true'
        # A venv, not plain pip3: 24.04 enforces PEP 668 and refuses
        # installs into the system interpreter.
        run: |
          python3 -m venv /opt/aqt
          /opt/aqt/bin/pip install --no-cache-dir aqtinstall
          /opt/aqt/bin/aqt install-qt linux desktop "$QT_VERSION" "$QT_ARCH" \
            -m qtmultimedia --outputdir /opt/qt

      - name: Locate Qt
        run: echo "QT_ROOT=/opt/qt/$QT_VERSION/gcc_64" >> "$GITHUB_ENV"

      - name: Build
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT"
          cmake --build build --parallel

      - name: Prepare icon
        run: |
          # linuxdeploy wants the icon basename to match Icon= in the .desktop
          # file, which is "obsbot-control", not "camera".
          cp resources/icons/camera.svg obsbot-control.svg

      - name: Fetch linuxdeploy
        run: |
          base=https://github.com/linuxdeploy
          curl -fsSLo /usr/local/bin/linuxdeploy \
            $base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSLo /usr/local/bin/linuxdeploy-plugin-qt \
            $base/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x /usr/local/bin/linuxdeploy /usr/local/bin/linuxdeploy-plugin-qt

      - name: Build AppImage
        env:
          ARCH: x86_64
          EXTRA_QT_MODULES: multimedia
        run: |
          export QMAKE="$QT_ROOT/bin/qmake6"
          export PATH="$QT_ROOT/bin:$PATH"
          export LD_LIBRARY_PATH="$QT_ROOT/lib:$LD_LIBRARY_PATH"
          # -l bundles the vendored SDK explicitly and lets linuxdeploy rewrite
          # its rpath; libGL/Mesa/libdrm are dropped by linuxdeploy's
          # excludelist so the host's drivers get used instead.
          linuxdeploy \
            --appdir AppDir \
            -e bin/obsbot-gui \
            -l sdk/lib/libdev.so.1.0.2 \
            -d obsbot-control.desktop \
            -i obsbot-control.svg \
            --plugin qt \
            --output appimage
          mv ./*.AppImage obsbot-control-x86_64.AppImage

      # A produced AppImage is not a working one. Confirm the SDK and a Qt
      # multimedia backend actually landed inside it.
      - name: Verify AppImage contents
        run: |
          ./obsbot-control-x86_64.AppImage --appimage-extract >/dev/null
          status=0

          for lib in libdev.so.1.0.2 libQt6Multimedia.so.6 libQt6OpenGLWidgets.so.6; do
            if ! find squashfs-root -name "$lib" | grep -q .; then
              echo "::error::$lib missing from AppImage"
              status=1
            fi
          done

          # QCamera is useless without a media backend plugin.
          if ! find squashfs-root -path '*multimedia*' -name '*.so' | grep -q .; then
            echo "::error::no QtMultimedia backend plugin bundled; camera preview would fail"
            status=1
          fi
          find squashfs-root -path '*multimedia*' -name '*.so' -printf 'backend: %f\n'

          # Host GL must NOT be bundled, or the GLSL filters break on other GPUs.
          if find squashfs-root \( -name 'libGL.so*' -o -name 'libdrm.so*' \) | grep -q .; then
            echo "::error::host GL/DRM libraries were bundled; must use the host's"
            status=1
          fi

          # The documented floor is the build container's glibc, not whatever
          # today's dependency set happens to need. Those differ: the bundle
          # currently tops out at 2.38, but promising 2.38 would stake the
          # compatibility claim on an incidental measurement that any Qt or
          # apt update could quietly raise. Promise 2.39 and enforce it.
          #
          # Every bundled ELF object counts, not just the executable. A Qt or
          # FFmpeg library can raise the real floor without obsbot-gui itself
          # changing, which the old single-binary objdump would have missed.
          echo "== highest glibc symbol version required by any bundled object =="
          worst=$(find squashfs-root -type f \( -name '*.so*' -o -path '*/bin/*' \) -print0 \
            | while IFS= read -r -d '' f; do
                file -b "$f" | grep -q ELF || continue
                objdump -T "$f" 2>/dev/null \
                  | grep -oE 'GLIBC_[0-9]+\.[0-9]+(\.[0-9]+)?'
              done | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "required: ${worst:-none}   documented floor: $GLIBC_FLOOR"
          if [ -n "$worst" ] \
             && [ "$(printf '%s\n%s\n' "$GLIBC_FLOOR" "$worst" | sort -V | tail -1)" != "$GLIBC_FLOOR" ]; then
            echo "::error::bundle needs glibc $worst, above the documented floor of $GLIBC_FLOOR;" \
                 "either lower the build container or update the documented floor in README.md"
            status=1
          fi
          exit $status

      - uses: actions/upload-artifact@v4
        with:
          name: obsbot-control-AppImage
          path: obsbot-control-x86_64.AppImage
          if-no-files-found: error
